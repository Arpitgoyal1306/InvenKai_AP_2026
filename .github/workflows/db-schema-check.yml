name: PostgreSQL Schema Check

on:
  push:
    branches: [main]
    paths: ['dbms/**', '.github/workflows/db-schema-check.yml']
  pull_request:
    branches: [main]
    paths: ['dbms/**', '.github/workflows/db-schema-check.yml']

permissions:
  contents: read

jobs:
  verify-postgres-schema:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: invenkai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d invenkai_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres_test_password
      PGDATABASE: invenkai_test

    steps:
      - uses: actions/checkout@v4

      - name: Execute schema DDL
        run: psql -v ON_ERROR_STOP=1 -f dbms/03_schema.sql

      - name: Execute schema assertions
        run: psql -v ON_ERROR_STOP=1 -f dbms/04_assertions.sql
