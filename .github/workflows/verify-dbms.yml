name: Verify DBMS schema

on:
  push:
  pull_request:

jobs:
  verify-schema:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invenkai
          POSTGRES_PASSWORD: invenkai
          POSTGRES_DB: invenkai_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invenkai -d invenkai_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: invenkai
      PGPASSWORD: invenkai
      PGDATABASE: invenkai_verify

    steps:
      - uses: actions/checkout@v4

      - name: Show PostgreSQL version
        run: psql -v ON_ERROR_STOP=1 -c "SELECT version();"

      - name: Create schema from 03_schema.sql (fresh database, stop on first error)
        run: psql -v ON_ERROR_STOP=1 -f dbms/03_schema.sql

      - name: Assert schema expectations (fails the job on any mismatch)
        run: psql -v ON_ERROR_STOP=1 -f dbms/04_verify_assertions.sql

      # Proves the assertions are not vacuous: break the schema on purpose and
      # require the assertion script to fail.
      - name: Self-test - assertions must fail on a broken schema
        run: |
          psql -v ON_ERROR_STOP=1 -c "DROP INDEX idx_order_outbox_pending;"
          if psql -v ON_ERROR_STOP=1 -f dbms/04_verify_assertions.sql; then
            echo "::error::Assertions passed on a deliberately broken schema"
            exit 1
          fi
          echo "Assertions correctly failed on the broken schema."